name: Deploy Automático

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e Atualizar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            git config --global --add safe.directory /var/www/equipes/26-marcaai/INI3A-EQ1
            cd /var/www/equipes/26-marcaai/INI3A-EQ1
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            cd src
            npm install || exit 1
            # se o build falhar, para aqui: o processo atual nao e apagado e o workflow fica vermelho no GitHub
            npm run build || exit 1
            npx drizzle-kit push

            pm2 delete marcaai || true
            pm2 start ./node_modules/.bin/next --name marcaai -- start -p 49682
            pm2 save